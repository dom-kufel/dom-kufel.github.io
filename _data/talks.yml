# Talks & posters shown on /talks/, newest first.
#
#   institution  Card title (required)
#   host         Department, group or event (optional)
#   kind         Talk | Poster | Talks
#   date         Free-form date string as displayed
#   year         Used to group past talks
#   location     Optional; omitted from the card when empty
#   url          Optional event link
#   logo         Path to a logo image; without it, `monogram` + `color` are used
#   logo_fit     cover → image fills the logo tile (for photos rather than logos)
#   photo        Card image (a resized copy in assets/img/talks/thumbs/)
#   photo_full   Full-resolution photo opened when the card image is clicked
#   photo_position  CSS object-position for cropping the card image
#   upcoming     true → listed under "Upcoming"
#   recurring    true → listed under "Recurring"

