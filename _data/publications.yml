  - title: Alternative quantisation condition for wavepacket dynamics in a hyperbolic double well
    authors: D. Kufel, H. Chomet, C. Faria
    year: 2021
    venue: "Journal of Physics A: Mathematical and Theoretical 54, 035304"
    field: Atomic Physics
    summary: >-
      Proposed a new analytical way of finding allowed energies in the class of hyperbolic-double well
      potentials by connecting it to a problem of finding roots of some polynomial. Applied this
      approach to understanding the role of non-adiabatic effects during enhanced ionization.
    links:
      - { label: Journal, url: "https://doi.org/10.1088/1751-8121/abd267" }
      - { label: arXiv, url: "https://arxiv.org/abs/2009.08737" }
      - { label: PDF, url: "https://iopscience.iop.org/article/10.1088/1751-8121/abd267/pdf" }

  - title: Online Learning and matching for resource allocation problems
    authors: A. Boskovic, Q. Chen, D. Kufel, Z. Zhou
    year: 2019
    venue: SIAM SIURO vol. 13
    field: AI
    summary: >-
      Devised, provided performance guarantees, and implemented algorithms integrating dual problems in
      convex optimization with a subclass of reinforcement learning techniques. Applied these
      algorithms to the traffic-shaping problem.
    links:
      - { label: Journal, url: "https://doi.org/10.1137/19S1300534" }
      - { label: arXiv, url: "https://arxiv.org/abs/1911.07409" }
      - { label: PDF, url: "https://www.siam.org/Portals/0/Publications/SIURO/Vol13/S130053PDF.pdf?ver=2020-10-13-095206-423" }

  - title: Analytical modelling of temperature effects on AMPA-type synapse
    authors: D. Kufel, G. Wojcik
    year: 2018
    venue: Journal of Computational Neuroscience 44, 379-391
    field: Computational Neuroscience
    summary: >-
      Used ODE-based modelling for understanding temperature effects on AMPA-type synapses in brain.
      Simplified the ODEs using some physically-motivated assumptions and shown how the obtained
      analytical solution faithfully reproduces the results of biological experiments.
    links:
      - { label: Journal, url: "https://doi.org/10.1007/s10827-018-0684-x" }
      - { label: arXiv, url: "https://arxiv.org/abs/1610.00611" }
      - { label: PDF, url: "https://link.springer.com/content/pdf/10.1007/s10827-018-0684-x.pdf?pdf=button" }

